services:
  personal-ai-agent:
    build:
      context: .
    image: personal-ai-knowledge-agent:course
    environment:
      PERSONAL_AGENT_DEMO_MODE: "1"
      PERSONAL_AGENT_HTTPS: "${PERSONAL_AGENT_HTTPS:-0}"
      PERSONAL_AGENT_WEB_SECRET: "${PERSONAL_AGENT_WEB_SECRET:?set PERSONAL_AGENT_WEB_SECRET}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - demo-runtime:/app/course_demo/runtime
      - ./course_demo/vault:/app/course_demo/vault
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  demo-runtime:
