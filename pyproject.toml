[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-ai-knowledge-agent"
version = "0.1.0"
description = "A stateful personal knowledge agent runtime"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Flask>=3.1,<3.2",
    "keyring>=25.7,<26",
    "waitress>=3.0,<4",
]
keywords = ["agent", "knowledge-management", "obsidian", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Text Processing :: Indexing",
]

[project.scripts]
personal-ai-agent = "personal_ai_agent.cli:main"
personal-ai-agent-web = "personal_ai_agent.web_server:main"
personal-ai-agent-demo = "personal_ai_agent.container_entrypoint:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
personal_ai_agent = ["web/templates/*.html", "web/static/*.css"]
