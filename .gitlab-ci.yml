stages:
  - test
  - package
  - container
  - deploy

default:
  interruptible: true

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONDONTWRITEBYTECODE: "1"

unit-test:
  stage: test
  image: python:3.12-slim
  cache:
    key: "pip-${CI_COMMIT_REF_SLUG}"
    paths:
      - .cache/pip/
  before_script:
    - python -m pip install .
  script:
    - python scripts/scan_secrets.py --working-tree
    - python scripts/verify.py
    - personal-ai-agent --help
    - personal-ai-agent-web --help
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

package-build:
  stage: package
  image: python:3.12-slim
  needs:
    - unit-test
  before_script:
    - python -m pip install build
  script:
    - python -m build
  artifacts:
    name: "python-package-${CI_COMMIT_SHORT_SHA}"
    paths:
      - dist/
    expire_in: 14 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

container-build:
  stage: container
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  needs:
    - unit-test
  script:
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "personal-ai-knowledge-agent:${CI_COMMIT_SHORT_SHA}"
      --no-push
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

deploy-demo:
  stage: deploy
  image: curlimages/curl:8.12.1
  needs:
    - unit-test
    - package-build
    - container-build
  script:
    - test -n "$DEPLOY_WEBHOOK_URL"
    - test -n "$DEMO_PUBLIC_URL"
    - curl --fail --silent --show-error --request POST "$DEPLOY_WEBHOOK_URL"
    - curl --fail --silent --show-error "$DEMO_PUBLIC_URL/health"
  environment:
    name: course-demo
    url: "$DEMO_PUBLIC_URL"
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'
  resource_group: course-demo
